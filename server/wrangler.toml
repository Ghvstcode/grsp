name = "grsp-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
APP_DEEP_LINK_SCHEME = "grsp"

[[d1_databases]]
binding = "DB"
database_name = "grsp-db"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id printed by `wrangler d1 create grsp-db`
migrations_dir = "migrations"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
[dev]
port = 3001
