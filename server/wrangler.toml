name = "grsp-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "api.grsp.app", custom_domain = true }]

[vars]
APP_DEEP_LINK_SCHEME = "grsp"
SERVER_URL = "https://api.grsp.app"

[[d1_databases]]
binding = "DB"
database_name = "grsp-db"
database_id = "fc6cc557-d5e4-497e-ab86-3867513a7f31"
migrations_dir = "migrations"

# 30 batches a minute per address on /metrics/events. The app sends one
# batch every 30 seconds, so this only bites abuse.
[[unsafe.bindings]]
name = "METRICS_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
[observability.logs]
enabled = true
invocation_logs = true
[dev]
port = 3001
