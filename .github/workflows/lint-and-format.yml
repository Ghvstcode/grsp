name: Lint, Format and Test

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-format:
        name: Lint, Format, Typecheck and Frontend Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Run ESLint
              run: pnpm lint

            - name: Run TypeScript check
              run: pnpm typecheck

            - name: Run frontend tests
              run: pnpm test

            # Deterministic tests for the eval scorer and fixture builder.
            # The evals themselves need a signed-in agent and are never run in CI.
            - name: Run eval scorer tests
              run: pnpm eval:test

    rust-tests:
        name: Rust Tests (git, verify, pipelines contract tests)
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install stable Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable
                  cache: true
                  cache-workspaces: src-tauri

            # tauri::generate_context! needs the frontendDist directory to exist.
            - name: Create empty frontend dist
              run: mkdir -p dist

            - name: Run cargo test
              run: cargo test --manifest-path src-tauri/Cargo.toml
